name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  # NOTA: jobul pentru "backend principal" (radacina giurom-backend, port 3001) a fost
  # eliminat - proiectul radacina nu are folder src/ (nici pe disk, nici in istoricul
  # git de pe main), deci nu exista ce sa se compileze. Functionalitatea pare sa fi
  # fost preluata de serviciul auth/ (veziv-auth2), care are cod sursa complet.

  deploy:
    name: Build & deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Prea multe rsync/SSH simultane reseteaza conexiunea pe server (exit 255).
      max-parallel: 4
      matrix:
        service:
          - api-gateway
          - auth
          - company
          - locations
          - recipes
          - stock
          - suppliers-ms
          - veziv-tasks
          - calendar-ms
          - employees
          - requests-ms
          - waste-records-ms
          - attendance-ms
          - notifications-ms

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.service }}
        run: npm run build

      - name: Strip devDependencies (nodul de deploy nu mai ruleaz? npm install)
        working-directory: ${{ matrix.service }}
        run: npm prune --omit=dev

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (dist + node_modules + package.json [+ migrations]) via rsync
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3"
          REMOTE="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/${{ secrets.DEPLOY_USER }}/giurom-backend/${{ matrix.service }}/"

          EXTRA_PATHS=()
          # suppliers-ms (?i orice serviciu cu folder migrations/)
          if [ -d "${{ matrix.service }}/migrations" ]; then
            EXTRA_PATHS+=("${{ matrix.service }}/migrations")
          fi

          for attempt in 1 2 3 4 5; do
            echo "Rsync attempt ${attempt}/5 for ${{ matrix.service }}..."
            if rsync -avz --delete \
              --exclude='.env' --exclude='.env.*' --exclude='uploads' \
              -e "ssh ${SSH_OPTS}" \
              ${{ matrix.service }}/dist \
              ${{ matrix.service }}/node_modules \
              ${{ matrix.service }}/package.json \
              "${EXTRA_PATHS[@]}" \
              "${REMOTE}"; then
              # stock: SQL-urile sunt în src/stock/migrations ? le punem ca migrations/ pe server
              if [ "${{ matrix.service }}" = "stock" ] && [ -d "stock/src/stock/migrations" ]; then
                rsync -avz --delete \
                  -e "ssh ${SSH_OPTS}" \
                  stock/src/stock/migrations/ \
                  "${REMOTE}migrations/" || {
                    if [ "${attempt}" -lt 5 ]; then sleep $((attempt * 10)); continue; fi
                    exit 1
                  }
              fi
              echo "Rsync succeeded on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              sleep $((attempt * 10))
            fi
          done

          echo "Rsync failed after 5 attempts for ${{ matrix.service }}"
          exit 1

      - name: Restart service with PM2
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3"

          for attempt in 1 2 3 4 5; do
            echo "PM2 restart attempt ${attempt}/5 for ${{ matrix.service }}..."
            if ssh ${SSH_OPTS} \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
                export NVM_DIR="$HOME/.nvm"
                [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
                cd /home/${{ secrets.DEPLOY_USER }}/giurom-backend/${{ matrix.service }}
                pm2 restart ${{ matrix.service }} --update-env || pm2 start dist/main.js --name ${{ matrix.service }}
                pm2 save
              '; then
              echo "PM2 restart succeeded on attempt ${attempt}"
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              sleep $((attempt * 10))
            fi
          done

          echo "PM2 restart failed after 5 attempts for ${{ matrix.service }}"
          exit 1

  migrate:
    name: Run DB migrations
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync migration files + runner scripts
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3"
          REMOTE_USER_HOST="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          REMOTE_ROOT="/home/${{ secrets.DEPLOY_USER }}/giurom-backend"

          ssh ${SSH_OPTS} "$REMOTE_USER_HOST" "mkdir -p '$REMOTE_ROOT/scripts'"

          # Orice serviciu cu folder migrations/ (suppliers-ms, company, auth, ...).
          # Runner-ul le cauta la $ROOT/<serviciu>/migrations/, deci pastram numele.
          for dir in */migrations; do
            [ -d "$dir" ] || continue
            service="${dir%%/*}"
            echo "Sync migrations: $service"
            ssh ${SSH_OPTS} "$REMOTE_USER_HOST" "mkdir -p '$REMOTE_ROOT/$service/migrations'"
            rsync -avz -e "ssh ${SSH_OPTS}" \
              "$dir/" \
              "$REMOTE_USER_HOST:$REMOTE_ROOT/$service/migrations/"
          done

          # stock: SQL-urile stau in src/stock/migrations, pe server le vrem ca stock/migrations.
          if [ -d "stock/src/stock/migrations" ]; then
            ssh ${SSH_OPTS} "$REMOTE_USER_HOST" "mkdir -p '$REMOTE_ROOT/stock/migrations'"
            rsync -avz -e "ssh ${SSH_OPTS}" \
              stock/src/stock/migrations/ \
              "$REMOTE_USER_HOST:$REMOTE_ROOT/stock/migrations/"
          fi

          rsync -avz -e "ssh ${SSH_OPTS}" \
            scripts/run-server-migrations.sh \
            scripts/migration-manifest.txt \
            scripts/seed-stock-waste-permissions.js \
            "$REMOTE_USER_HOST:$REMOTE_ROOT/scripts/"

          ssh ${SSH_OPTS} "$REMOTE_USER_HOST" "chmod +x '$REMOTE_ROOT/scripts/run-server-migrations.sh'"

      - name: Apply pending migrations on server
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3"
          ssh ${SSH_OPTS} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -euo pipefail
            export GIUROM_BACKEND_ROOT="$HOME/giurom-backend"
            bash "$HOME/giurom-backend/scripts/run-server-migrations.sh"
          '

      - name: Restart services touched by migrations
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT }} -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3"
          ssh ${SSH_OPTS} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            pm2 restart suppliers-ms stock auth company --update-env
            pm2 save
          '
